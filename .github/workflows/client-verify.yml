name: Verify Google client (exact)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python client_check.py
        env:
          EXACT: "1"
          CID_RAW: ${{ secrets.YT_CLIENT_ID }}
          CSEC_RAW: ${{ secrets.YT_CLIENT_SECRET }}

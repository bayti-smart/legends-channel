name: Daily legend
on:
  schedule:                     # two videos a day (GitHub may delay a run by some minutes). Times are UTC.
    - cron: "0 15 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not upload (true/false)"
        default: "false"
      topic:
        description: "Force a topic (optional)"
        default: ""
permissions:
  contents: write                # lets the job commit topics.json / published.json
concurrency: daily-legend
jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            models
            fonts
          key: legend-assets-v1
      - name: Make and post today's legend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_REFERRER: ${{ vars.POLLINATIONS_REFERRER }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          SEND_PREVIEW: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then ARGS="$ARGS --topic \"${{ github.event.inputs.topic }}\""; fi
          eval python daily.py $ARGS
      - name: Publish a preview of the dry run (private pre-release)
        if: always() && github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=$(ls out/*.mp4 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            TAG="preview-$(date +%Y%m%d-%H%M%S)"
            gh release create "$TAG" "$F" out/*.json --title "$TAG" --notes "Dry-run preview (not published anywhere)" --prerelease
          fi
      - name: Save state (topics / published list)
        if: always()
        run: |
          git config user.name "legend-bot"
          git config user.email "legend-bot@users.noreply.github.com"
          git add topics.json published.json playbook.json
          git diff --cached --quiet || (git commit -m "daily state" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legend-output
          path: out/*.mp4
          retention-days: 7

name: Daily legend
on:
  schedule:
    - cron: "0 21 * * *"        # every day 21:00 UTC (GitHub may delay it by some minutes) - change as you like
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not upload (true/false)"
        default: "false"
      topic:
        description: "Force a topic (optional)"
        default: ""
permissions:
  contents: write                # lets the job commit topics.json / published.json
concurrency: daily-legend
jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            models
            fonts
          key: legend-assets-v1
      - name: Make and post today's legend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then ARGS="$ARGS --topic \"${{ github.event.inputs.topic }}\""; fi
          eval python daily.py $ARGS
      - name: Save state (topics / published list)
        if: always()
        run: |
          git config user.name "legend-bot"
          git config user.email "legend-bot@users.noreply.github.com"
          git add topics.json published.json
          git diff --cached --quiet || (git commit -m "daily state" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legend-output
          path: out/*.mp4
          retention-days: 7

name: Weekly review
on:
  schedule:
    - cron: "23 6 * * 1"          # every Monday 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-legend
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests numpy pillow
      - name: Learn from the results
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly.py
      - name: Save state
        if: always()
        run: |
          git config user.name "legend-bot"
          git config user.email "legend-bot@users.noreply.github.com"
          git add playbook.json topics.json published.json
          git diff --cached --quiet || (git commit -m "weekly review" && git push)
